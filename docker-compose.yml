services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/analytics
      UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      PROCESSED_DIR: /app/storage/processed
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-please-use-32-bytes-min}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SCHEDULER_ENABLED: "false"
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-1}
      MONITORING_INTERVAL_MINUTES: ${MONITORING_INTERVAL_MINUTES:-15}
      DEV_RELOAD: ${DEV_RELOAD:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/analytics
      UPLOAD_DIR: /app/storage/uploads
      PROCESSED_DIR: /app/storage/processed
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-please-use-32-bytes-min}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-1}
      MONITORING_INTERVAL_MINUTES: ${MONITORING_INTERVAL_MINUTES:-15}
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.scheduler_worker"]
    volumes:
      - ./apps/api:/app
      - ./storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/analytics
      UPLOAD_DIR: /app/storage/uploads
      PROCESSED_DIR: /app/storage/processed
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-please-use-32-bytes-min}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      APP_ENV: ${APP_ENV:-development}
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.analysis_worker"]
    volumes:
      - ./apps/api:/app
      - ./storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
